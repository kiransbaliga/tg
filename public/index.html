<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Media is served via redirects to the R2 custom domain, which has Cloudflare
       Hotlink Protection enabled (blocks requests carrying a foreign Referer).
       Send no Referer so those requests are allowed. -->
  <meta name="referrer" content="no-referrer" />
  <title>TG Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>" />
</head>
<body>
  <div class="layout" id="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="user-profile" id="user-profile" title="Account status">
          <span class="avatar-initials" id="user-avatar-initials">TG</span>
        </div>
        <div class="sidebar-title-container">
          <h1 class="sidebar-title">My Chats</h1>
        </div>
        <div class="sidebar-actions">
          <button id="add-album" class="btn-icon-add" title="Add an album from Telegram">+</button>
          <div id="status-badge" class="status-badge" title="Connection status"></div>
        </div>
      </div>
      <nav id="album-list" class="album-list"></nav>
    </aside>

    <main class="main">
      <header class="main-header">
        <button id="btn-back-to-albums" class="btn-back" title="Back to albums">←</button>
        <div class="main-header-title">
          <h1 id="active-album-title">Select an Album</h1>
          <div id="active-album-subtitle" class="meta">Select a chat from the sidebar to view media.</div>
        </div>
        <div class="main-header-actions">
          <select id="header-uploader-filter" class="uploader-filter-select" style="display: none;"></select>
          <button id="btn-sync-album" class="btn-action-icon" title="Sync from Telegram">↻ Sync</button>
          <button id="btn-upload-media" class="btn-action-icon" title="Upload new media">📤 Upload</button>
          <button id="btn-select-mode" class="btn-action-icon" title="Select items">☑ Select</button>
        </div>
      </header>

      <!-- Spotlight Header Grid -->
      <section id="spotlight-section" class="spotlight-section hidden">
        <div class="spotlight-left">
          <div id="spotlight-media-card" class="spotlight-card media-card">
            <!-- Large video/photo will be rendered here -->
            <div class="spotlight-placeholder">No media available</div>
          </div>
        </div>
        <div class="spotlight-right">
          <!-- Card 1: Stats -->
          <div class="spotlight-card info-card">
            <div class="spotlight-card-label">Stats</div>
            <div class="spotlight-card-value" id="spotlight-stats">0 items</div>
            <div class="spotlight-card-sub" id="spotlight-sync-time">Never synced</div>
          </div>
          <!-- Card 2: Members / Uploaders -->
          <div class="spotlight-card members-card" id="spotlight-members-card">
            <div class="spotlight-card-label">Members</div>
            <div class="avatar-stack-container">
              <div class="avatar-stack" id="spotlight-avatar-stack"></div>
              <div class="avatar-stack-text" id="spotlight-members-count">+0</div>
            </div>
            <div class="members-list-tooltip" id="members-list-tooltip">
              <h4>Active Uploaders</h4>
              <div id="members-list-items"></div>
            </div>
          </div>
          <!-- Card 3: Upload -->
          <div class="spotlight-card add-card" id="spotlight-upload-card">
            <div class="add-card-content">
              <span class="add-icon">+</span>
              <span class="add-label">Add</span>
            </div>
          </div>
        </div>
      </section>

      <div id="gallery" class="gallery"></div>
      <div id="sentinel" class="sentinel"></div>
      <div id="empty" class="empty"></div>
    </main>
  </div>

  <!-- Web Login Overlay -->
  <div id="login-overlay" class="modal" style="background: #0a0c10; z-index: 10000; align-items: center; justify-content: center; display: none; color: #c9d1d9;">
    <div class="modal-card" style="max-width: 400px; width: 90%; border: 1px solid #30363d; background: #0d1117; padding: 32px 24px; border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.6);">
      <div style="text-align: center; margin-bottom: 28px;">
        <span style="font-size: 54px; color: #58a6ff;">◈</span>
        <h2 style="margin-top: 12px; font-size: 24px; font-weight: 600; color: #f0f6fc;">Log in to Telegram</h2>
        <p style="color: #8b949e; font-size: 14px; margin-top: 6px; line-height: 1.4;">Connect your account to view your media gallery.</p>
      </div>
      
      <!-- Step 1: Phone Input -->
      <div id="login-step-phone">
        <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #c9d1d9; font-size: 14px;">Phone Number</label>
        <input id="login-phone" class="search" type="tel" placeholder="+15551234567" style="margin-bottom: 16px; width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 10px; font-size: 16px;" />
        <button id="login-send" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px;">Send Code</button>
      </div>

      <!-- Step 2: Code Input -->
      <div id="login-step-code" style="display: none;">
        <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #c9d1d9; font-size: 14px;">Telegram Verification Code</label>
        <input id="login-code" class="search" type="text" placeholder="Enter code sent to Telegram…" style="margin-bottom: 16px; width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 10px; font-size: 16px;" />
        
        <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #c9d1d9; font-size: 14px;">2FA Password (Optional)</label>
        <input id="login-2fa" class="search" type="password" placeholder="Your two-step password…" style="margin-bottom: 16px; width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 10px; font-size: 16px;" />
        
        <button id="login-submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px;">Log In</button>
        <button id="login-back" class="btn" style="width: 100%; margin-top: 8px; background: transparent; border: 1px solid #30363d; color: #c9d1d9; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px;">Back</button>
      </div>

      <div id="login-error" style="color: #ff7b72; font-size: 14px; margin-top: 16px; text-align: center; display: none; background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.2); padding: 8px; border-radius: 6px; line-height: 1.4;"></div>
    </div>
  </div>

  <!-- Add-album modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Add an album</h2>
        <button id="modal-close" class="icon-btn">✕</button>
      </div>
      <input id="dialog-search" class="search" type="text" placeholder="Search your chats…" />
      <div id="dialog-list" class="dialog-list"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <button id="lb-close" class="lb-btn lb-close" title="Close (Esc)">✕</button>
    <button id="lb-prev" class="lb-btn lb-prev" title="Previous (←)">‹</button>
    <button id="lb-next" class="lb-btn lb-next" title="Next (→)">›</button>
    <div id="lb-stage" class="lb-stage"></div>
    <div class="lb-bar">
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 70%;">
        <div id="lb-caption" class="lb-caption"></div>
        <div id="lb-uploader" style="font-size: 12px; color: #8b949e;"></div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="lb-share" class="lb-share-btn" title="Copy shareable link">🔗 Copy link</button>
        <a id="lb-download" class="lb-download" href="#" download>⬇ Download original</a>
      </div>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
