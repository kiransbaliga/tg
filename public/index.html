<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TG Gallery</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-name">TG Gallery</span>
    </div>
    <div id="status" class="status"></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>Albums</span>
        <button id="add-album" class="btn-add" title="Add an album from your Telegram chats">+ Add</button>
      </div>
      <nav id="album-list" class="album-list"></nav>
    </aside>

    <main class="main">
      <div id="main-head" class="main-head"></div>
      <div id="gallery" class="gallery"></div>
      <div id="sentinel" class="sentinel"></div>
      <div id="empty" class="empty"></div>
    </main>
  </div>

  <!-- Web Login Overlay -->
  <div id="login-overlay" class="modal" style="background: rgba(10, 12, 16, 0.96); z-index: 10000; align-items: center; justify-content: center; display: none; color: #c9d1d9;">
    <div class="modal-card" style="max-width: 400px; width: 90%; border: 1px solid #30363d; background: #0d1117; padding: 32px 24px; border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.6);">
      <div style="text-align: center; margin-bottom: 28px;">
        <span style="font-size: 54px; color: #58a6ff;">◈</span>
        <h2 style="margin-top: 12px; font-size: 24px; font-weight: 600; color: #f0f6fc;">Log in to Telegram</h2>
        <p style="color: #8b949e; font-size: 14px; margin-top: 6px; line-height: 1.4;">Connect your account to view your media gallery.</p>
      </div>
      
      <!-- Step 1: Phone Input -->
      <div id="login-step-phone">
        <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #c9d1d9; font-size: 14px;">Phone Number</label>
        <input id="login-phone" class="search" type="tel" placeholder="+15551234567" style="margin-bottom: 16px; width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 10px; font-size: 16px;" />
        <button id="login-send" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px;">Send Code</button>
      </div>

      <!-- Step 2: Code Input -->
      <div id="login-step-code" style="display: none;">
        <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #c9d1d9; font-size: 14px;">Telegram Verification Code</label>
        <input id="login-code" class="search" type="text" placeholder="Enter code sent to Telegram…" style="margin-bottom: 16px; width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 10px; font-size: 16px;" />
        
        <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #c9d1d9; font-size: 14px;">2FA Password (Optional)</label>
        <input id="login-2fa" class="search" type="password" placeholder="Your two-step password…" style="margin-bottom: 16px; width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 10px; font-size: 16px;" />
        
        <button id="login-submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px;">Log In</button>
        <button id="login-back" class="btn" style="width: 100%; margin-top: 8px; background: transparent; border: 1px solid #30363d; color: #c9d1d9; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 6px;">Back</button>
      </div>

      <div id="login-error" style="color: #ff7b72; font-size: 14px; margin-top: 16px; text-align: center; display: none; background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.2); padding: 8px; border-radius: 6px; line-height: 1.4;"></div>
    </div>
  </div>

  <!-- Add-album modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Add an album</h2>
        <button id="modal-close" class="icon-btn">✕</button>
      </div>
      <input id="dialog-search" class="search" type="text" placeholder="Search your chats…" />
      <div id="dialog-list" class="dialog-list"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <button id="lb-close" class="lb-btn lb-close" title="Close (Esc)">✕</button>
    <button id="lb-prev" class="lb-btn lb-prev" title="Previous (←)">‹</button>
    <button id="lb-next" class="lb-btn lb-next" title="Next (→)">›</button>
    <div id="lb-stage" class="lb-stage"></div>
    <div class="lb-bar">
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 70%;">
        <div id="lb-caption" class="lb-caption"></div>
        <div id="lb-uploader" style="font-size: 12px; color: #8b949e;"></div>
      </div>
      <a id="lb-download" class="lb-download" href="#" download>⬇ Download original</a>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
